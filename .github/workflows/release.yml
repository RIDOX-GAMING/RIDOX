name: Build & Release RIDOX (Windows + Android)

# Triggers automatically whenever a version tag (e.g. v1.0.0) is pushed.
# Both the Windows EXE and the Android APK are built in parallel and
# published together into the SAME GitHub Release.
# Also allows manual runs from the Actions tab for testing (no release
# will be published on manual runs unless triggered from a tag).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows executable
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename primary artifact to RIDOX.exe
        shell: bash
        run: |
          mkdir -p release-out
          find dist -maxdepth 1 -iname "*.exe" -exec cp {} release-out/RIDOX.exe \;
          ls -la release-out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIDOX-windows
          path: release-out/RIDOX.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/RIDOX.exe
          name: RIDOX ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RIDOX-A

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename primary artifact to RIDOX.apk
        shell: bash
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk release-out/RIDOX.apk
          ls -la release-out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIDOX-android
          path: RIDOX-A/release-out/RIDOX.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RIDOX-A/release-out/RIDOX.apk
          name: RIDOX ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
