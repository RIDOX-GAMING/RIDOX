name: Build & Release RIDOX

# Triggers automatically whenever a version tag (e.g. v1.0.0) is pushed.
# Also allows manual runs from the Actions tab for testing.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows executable
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename primary artifact to RIDOX.exe
        shell: bash
        run: |
          mkdir -p release-out
          # electron-builder (nsis) emits an installer exe; normalize its name to RIDOX.exe
          find dist -maxdepth 1 -iname "*.exe" -exec cp {} release-out/RIDOX.exe \;
          ls -la release-out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIDOX-windows
          path: release-out/RIDOX.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/RIDOX.exe
          name: RIDOX ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
